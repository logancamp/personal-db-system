spring.application.name=MyApp

# Set SERVER_ADDRESS=0.0.0.0 only behind TLS (see README).
server.address=${SERVER_ADDRESS:127.0.0.1}

spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=${myappdb.username}
spring.datasource.password=${myappdb.password}

# Vault supplies the datasource credentials. The token must come from the environment.
spring.cloud.vault.token=${VAULT_TOKEN}
spring.cloud.vault.scheme=http
spring.cloud.vault.kv.enabled=true
spring.config.import=vault://

logging.level.sql=error
logging.level.web=error
logging.level.org.springframework.security=error

spring.web.error.include-stacktrace=never
spring.web.error.include-message=never

# Encrypts stored LLM API keys. Required, at least 16 characters, no default.
app.key.password=${KEY_PASSWORD}

spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.name=personal-server
spring.ai.mcp.server.version=0.0.1
spring.ai.model.chat=none
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none

# Virtual threads let a blocking agent call wait without holding a pooled thread.
spring.threads.virtual.enabled=true
